          "Dat men de daad alleen voor Allah verricht; met al-Kahf 18:110 over wie met zijn daden pronkt",
          "Dat men de waarheid niet uit hoogmoed verwerpt; met aṣ-Ṣāffāt 37:35 over de mushrikūn"
        ]
      },
      {
        question: "Iemand gelooft innerlijk werkelijk in de shahādah en spreekt die uit. Maar in de moskee maakt hij zijn gebed langer en mooier omdat mensen naar hem kijken.\n\nWelke voorwaarde is hier volgens de les in het bijzonder aangetast?",
        options: [
          "Aṣ-ṣidq",
          "Al-yaqīn",
          "Al-qabūl",
          "Al-ikhlāṣ"
        ]
      },
      {
        question: "Een zuster vindt het dragen van de niqāb zwaar, maar draagt hem toch omdat zij Allah wil gehoorzamen.\n\nHoe werd zo'n situatie in de les beoordeeld?",
        options: [
          "Dit is in strijd met de voorwaarde liefde, want 47:9 zegt dat wie iets van de openbaring afkeurt, zijn daden verliest.",
          "Dit is in strijd met de voorwaarde overgave, omdat ware inqiyād geen enkele moeite toelaat.",
          "Dit is niet in strijd met de liefde: natuurlijke moeite (vgl. 2:216) is iets anders dan haat voor de openbaring (47:9).",
          "Dit raakt de voorwaarden niet, omdat die alleen over de uitspraak van de shahādah gaan en niet over daden."
        ]
      },
      {
        question: "\"En wie zijn gezicht aan Allah overgeeft terwijl hij goeddoet, heeft zich werkelijk vastgegrepen aan het stevigste houvast.\" [Luqmān 31:22]\n\nWaarnaar verwijst \"het stevigste houvast\" volgens de uitleg in de matn?",
        options: [
          "De islam in het algemeen, met al haar voorschriften",
          "De getuigenis lā ilāha illā Allāh",
          "Het vasthouden aan de Qurʾān en de Sunnah",
          "De liefde voor Allah en Zijn Boodschapper ﷺ"
        ]
      },
      {
        question: "\"Voorwaar, wanneer tegen hen werd gezegd: 'Er is geen god die het recht heeft aanbeden te worden behalve Allah', waren zij hoogmoedig. En zij zeiden: 'Zullen wij werkelijk onze goden verlaten vanwege een bezeten dichter?'\" [aṣ-Ṣāffāt 37:35-36]\n\nVoor welke voorwaarde gebruikt de matn dit vers, en wat ontbrak bij hen? (Kies BESTE antwoord).",
        options: [
          "Kennis: zij begrepen de betekenis van lā ilāha illā Allāh niet.",
          "Zekerheid: zij twijfelden of lā ilāha illā Allāh de waarheid was.",
          "Overgave: zij aanvaardden haar innerlijk, maar handelden er niet naar.",
          "Acceptatie: zij begrepen de betekenis wel, maar verwierpen haar uit hoogmoed."
        ]
      },
      {
        question: "Sommige geleerden noemen al-kufr biṭ-ṭāghūt als achtste voorwaarde. Hoe werd dit in de les ingedeeld?",
        options: [
          "Het is geen losse achtste voorwaarde, maar een rukn die besloten ligt in de ontkenning (lā ilāha).",
          "Het is een achtste voorwaarde, gelijkwaardig aan de zeven en los van hen.",
          "Het is een voorwaarde voor volmaaktheid, niet voor geldigheid.",
          "Het is een rukn die besloten ligt in de bevestiging (illā Allāh)."
        ]
      }
    ];

    let current = 0;
    let selected = null;

    const progressEl = document.getElementById('progress');
    const sectionEl = document.getElementById('section');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('nextBtn');
    const counterEl = document.getElementById('counter');
    const app = document.getElementById('app');

    function render() {
      if (current >= questions.length) {
        app.innerHTML = '<div class="end"></div>';
        return;
      }

      const q = questions[current];
      progressEl.style.width = ((current / questions.length) * 100) + '%';
      sectionEl.textContent = q.section || '';
      questionEl.textContent = q.question;
      counterEl.textContent = (current + 1) + ' / ' + questions.length;

      optionsEl.innerHTML = '';
      selected = null;
      nextBtn.disabled = true;

      q.options.forEach((opt, i) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.innerHTML = `<input type="radio" name="opt" value="${i}"><span>${opt}</span>`;
        label.addEventListener('click', () => {
          document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
          label.classList.add('selected');
          selected = i;
          nextBtn.disabled = false;
        });
        optionsEl.appendChild(label);
      });
    }

    nextBtn.addEventListener('click', () => {
      if (selected === null) return;
      current++;
      render();
    });

    render();
  </script>
</body>
</html>
